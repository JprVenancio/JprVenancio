<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">João Pedro Venâncio — Software Developer</title>
  <desc id="desc">Header de perfil GitHub com visual técnico escuro e animação sutil.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="55%" stop-color="#101722"/>
      <stop offset="100%" stop-color="#0a0d13"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#2f81f7" stop-opacity=".16"/>
      <stop offset="55%" stop-color="#7c3aed" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f81f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="338" rx="28" fill="url(#bg)" stroke="#263041" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="338" rx="28" fill="url(#glow)"/>

  <!-- ambient accents -->
  <circle cx="210" cy="96" r="62" fill="#2f81f7" opacity=".05" filter="url(#blur)"/>
  <circle cx="1012" cy="254" r="76" fill="#8b5cf6" opacity=".05" filter="url(#blur)"/>

  <!-- technical rails -->
  <path d="M96 74 H310" stroke="#303a4b" stroke-width="1.5" opacity=".7"/>
  <path d="M890 266 H1104" stroke="#303a4b" stroke-width="1.5" opacity=".7"/>
  <circle cx="96" cy="74" r="4" fill="#58a6ff"/>
  <circle cx="1104" cy="266" r="4" fill="#a78bfa"/>

  <!-- main text -->
  <text x="600" y="130"
        fill="#f0f6fc"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="47"
        font-weight="700"
        text-anchor="middle"
        letter-spacing=".2">
    João Pedro Venâncio
  </text>

  <text x="600" y="176"
        fill="#b7c2d0"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="22"
        font-weight="500"
        text-anchor="middle">
    Software Developer
  </text>

  <text x="600" y="214"
        fill="#7f8da3"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="16"
        text-anchor="middle"
        letter-spacing=".7">
    Backend  •  APIs  •  Systems  •  Security
  </text>

  <!-- animated signal -->
  <line x1="360" y1="254" x2="840" y2="254" stroke="#263041" stroke-width="2" stroke-linecap="round"/>
  <line x1="455" y1="254" x2="745" y2="254" stroke="url(#line)" stroke-width="2.5" stroke-linecap="round"/>

  <circle cx="455" cy="254" r="5" fill="#58a6ff" filter="url(#softGlow)">
    <animate attributeName="cx" values="455;745;455" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".35;1;.35" dur="5.5s" repeatCount="indefinite"/>
  </circle>

  <text x="600" y="291"
        fill="#596579"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="13"
        text-anchor="middle"
        letter-spacing=".9">
    BUILD  •  LEARN  •  EVOLVE
  </text>
</svg>
